  # file; these pairs are the redaction that satisfies it. Added AFTER the owner
  # pairs so path/slug occurrences are already normalized (the '\bcamilla-2026\b'
  # slug pair above runs first). Ordered longest-first within each name so the
  # full name never leaves a half-redacted surname behind.
