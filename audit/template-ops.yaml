  - from: '\bbeatstep\b'
    to: 'projeto-x'
  # -- client production name (WAID project) -> Projeto X ---------------------------
  - from: '\(Smoke Ninja Cat\)'
    to: '(Projeto X)'
  # -- owner project-repo paths (client slugs) -> %PROJECT_REPO%; longest first ------
  # (fix wave) client repos live as C:\AI\<slug>; normalize to a neutral placeholder.
  # MUST stay before any shorter overlapping pattern and never touch C:\AI\GNNSS_VAULT
  # (the canonical vault path is redacted by its own dedicated pair below; the
  # byte-identical check-links.ps1 copy keeps its original bytes because it is
  # byte-copied and never template-ized).
  - from: 'C:\\AI\\camilla-2026-catalog-preview'
    to: '%PROJECT_REPO%'
  - from: 'C:\\AI\\camilla-2026-docs-sync'
    to: '%PROJECT_REPO%'
  - from: 'C:\\AI\\camilla-2026'
