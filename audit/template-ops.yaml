  # -- composite slugs (2026-10-10) --------------------------------------------------
  # Joined tokens the \b pairs above cannot reach: the Instagram handle, the board
  # domain, the GitHub org. Longest form first so the compound never leaves a
  # half-redacted stub behind.
  # 'EditCamilla01'-style: the name embedded mid-token between letters and digits.
