  #    ordered AFTER the path pairs above so path occurrences are already gone ------
  - from: '\bcamilla-2026\b'
    to: 'cliente-a'
  # -- owner drive root (2026-10-10) -------------------------------------------------
  # 'E:/DRIVE' is this machine's asset drive: the letter plus the folder name are
  # owner layout, and a fresh install has neither. The path-scan rules cover
  # C:\Users\ but not a bare drive root, so it is redacted here. Both separators
  # and both cases, longest form first.
  - from: 'E:/DRIVE/My Drive'
    to: '%DRIVE%/My Drive'
  - from: 'E:\\DRIVE\\My Drive'
    to: '%DRIVE%\\My Drive'
  - from: 'E:/DRIVE'
    to: '%DRIVE%'
  - from: 'E:\\DRIVE'
    to: '%DRIVE%'
  # -- owner machine paths ----------------------------------------------------------
  - from: 'C:\\Users\\gnnss'
    to: '%USERPROFILE%'
  - from: '\bOneDrive\b'
    to: 'CloudFolder'
  - from: '\bonedrive\b'
    to: 'cloudfolder'
  # -- owner vault path (Wave 3 path-scan, policy b) ----------------------------------
  # Every shipped mention of the canonical vault path becomes the
  # %OBSIDIAN_VAULT_PATH% placeholder (same pattern as audit-health.ps1 above).
  # check-links.ps1 is unaffected: byte-copied, never template-ized.
  - from: 'C:\\AI\\GNNSS_VAULT\b'
    to: '%OBSIDIAN_VAULT_PATH%'
  # -- username residue (Wave 3 path-scan, policy a) -----------------------------------
  # Domain-qualified and bare lowercase username mentions become neutral
  # placeholders. Case-sensitive on purpose: "GNNSS_VAULT" / "GNNSS Vault" are
  # the vault product name and stay machine-neutral.
  - from: 'GNNSS\\gnnss'
    to: '<DOMAIN>\<user>'
  - from: '\bgnnss\b'
    to: '<user>'
  # -- client-name backstop (2026-10-10; closes follow-up 2.7) -----------------------
