# template-ops.yaml - build-time content operations for template-ized files (task 3.1).
# Data consumed by scripts/build-skeleton.ps1. Runners stay thin: this file declares
# WHICH files get template-ized and the exact line drops / regex replacements applied.
#
# Why template-ize: the sanitization gate (audit/rules.yaml) must report 0 hits over
# vault-template/ while conventions/knowledge notes keep their methodology value.
# Client names become generic cliente-a/cliente-b placeholders, owner machine paths
# become %USERPROFILE%, and diary wording becomes neutral "registro". Zone tokens in
# Operating Rules / Tag Taxonomy are structural taxonomy and are allowlisted in
# rules.yaml instead of rewritten.
#
# YAML subset: same flat engine as zone-map.yaml (comments, 2-space lists/maps,
# single-quoted scalars). Fields:
#   shared_replace: ordered regex pair list applied AFTER a file's own pairs.
#   files: list of { path (vault-template-relative), drop: [line substrings],
#                    replace: ordered regex pair list }
# Replacement 'to' values may contain \n (converted to a newline by the builder).
# 'from' values are .NET regex (Escape metacharacters); matching is case-sensitive.
# NOTE: the live vault uses em dashes (U+2014) in prose; drop/replace substrings
# below copy them verbatim (this file is UTF-8, non-ASCII allowed in data).

shared_replace:
  # -- client A (person + project slug); longest/most specific first --------------
  - from: '32\.08-camila-2026-moc\.md'
