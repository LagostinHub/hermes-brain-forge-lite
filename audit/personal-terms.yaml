# 'camillagonda' (the Instagram handle), 'camillakan' (the board domain) and
# 'lagostinhub' (the GitHub org) all passed the \bcamilla\b / \blagostin\b rules.
# Measured in the built template: 9 camilla + 2 lagostin hits the gate reported clean.
- camillagonda
- camillakan
- lagostinhub
- leprevost
